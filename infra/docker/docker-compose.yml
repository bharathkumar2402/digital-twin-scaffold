services:
  api:
    build:
      context: ../../backend
      dockerfile: Dockerfile
    env_file: .env
    ports:
      - "8000:8000"
    volumes:
      - ../../backend:/app
    depends_on:
      - redis

  ws-server:
    build:
      context: ../../backend
      dockerfile: Dockerfile
    command: ["uvicorn", "app.ws:app", "--host", "0.0.0.0", "--port", "8001", "--reload"]
    env_file: .env
    ports:
      - "8001:8001"
    depends_on:
      - redis

  celery-worker:
    build:
      context: ../../backend
      dockerfile: Dockerfile
    command: ["celery", "-A", "app.core.celery_app", "worker", "--loglevel=info", "-Q", "celery,sandbox-results"]
    env_file: .env
    depends_on:
      - redis

  agent-runner:
    build:
      context: ../../backend
      dockerfile: Dockerfile
    command: ["python", "-m", "app.agents.runner"]
    env_file: .env
    depends_on:
      - redis

  upload-sandbox:
    # Isolated worker for floor-plan file processing. No shared volume/filesystem with
    # the main API, and — unlike every other backend service here — NOT `env_file:
    # .env`: it gets its own `.env.sandbox`, which holds only Redis/MinIO variables, so
    # Postgres/Timescale credentials never enter this container's environment at all
    # even if it were compromised. See app/sandbox/** and docs/PROJECT_PLAN.md §6.
    build:
      context: ../../backend
      dockerfile: Dockerfile.sandbox
    command: ["celery", "-A", "app.sandbox.celery_app.sandbox_celery_app", "worker", "--loglevel=info", "-Q", "upload-sandbox"]
    env_file: .env.sandbox
    depends_on:
      - redis
      - minio

  frontend:
    build:
      context: ../../frontend
    ports:
      - "5173:5173"
    volumes:
      - ../../frontend:/app

  # No separate tile-server container: martin serves PostGIS/MBTiles/PMTiles, not the
  # loose {z}/{x}/{y}.png XYZ tree gdal2tiles.py's raster profile produces (task 2.3).
  # MinIO's own S3 API serves that tree directly — app/sandbox/storage.py sets an
  # anonymous-read policy scoped to the facility-map-tiles bucket, so a tile URL like
  # http://localhost:9000/facility-map-tiles/{prefix}/{z}/{x}/{y}.png is fetchable
  # straight off this container (see issue 2.4). Only that one bucket is public; every
  # other bucket keeps the default deny-by-default policy.
  minio:
    image: minio/minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      # MapLibre (task 2.5) uploads raster tiles into WebGL textures, which requires
      # the tile images to clear CORS - otherwise the browser throws a SecurityError
      # on texture upload and nothing renders. The self-hosted "minio/minio" image
      # used here doesn't support the S3 PutBucketCors API at all (that's an
      # AIStor/paid-tier-only feature - see minio/minio#15874), so this uses MinIO's
      # server-wide CORS env var instead, scoped to just the frontend's dev origin
      # rather than "*".
      MINIO_API_CORS_ALLOW_ORIGIN: ${MINIO_API_CORS_ALLOW_ORIGIN}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data

  redis:
    image: redis:7
    ports:
      - "6379:6379"

  prometheus:
    image: prom/prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml

  grafana:
    image: grafana/grafana
    ports:
      - "3000:3000"

# NOTE: PostgreSQL, TimescaleDB, and (in production) Redis are managed services in this
# project (see docs/PROJECT_PLAN.md §3.2) and are connected via .env, not run here.
# A local Postgres/Timescale container can be added for offline dev if needed, but is
# not part of the default demo stack.

volumes:
  minio-data:
